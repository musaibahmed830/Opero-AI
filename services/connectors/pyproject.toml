[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opero-connectors"
version = "0.1.0"
description = "Connector interfaces (email/calendar/CRM/document) + mocks for Opero AI (docs/MVP_SCOPE.md)."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["opero_connectors*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
