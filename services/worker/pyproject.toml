[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opero-worker"
version = "0.1.0"
description = "Celery background-job worker for Opero AI (docs/TECHNOLOGY_STACK.md §2)."
requires-python = ">=3.12"
dependencies = [
    "celery[redis]==5.4.0",
]

[tool.setuptools.packages.find]
include = ["opero_worker*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
