[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opero-ai-engine"
version = "0.1.0"
description = "Model-provider interface and Ollama implementation for Opero AI (docs/AI_ARCHITECTURE.md)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[tool.setuptools.packages.find]
include = ["opero_ai_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
